<!doctype html>
<!-- Three screens, driven by the hash so the back button and a shared link both work:
       #/lang              choose the language the page speaks (and the translation)
       #/target/<lang>     choose the language of the sentences (only Japanese for now)
       #/read/<lang>/<tgt> search, and the list of narrative titles
       #/read/<lang>/<tgt>/<key>  one narrative, opened in full
     hide-romaji is on at load because the Romaji box starts unchecked; the change listener
     toggles the same class, so the two cannot disagree. -->
<html lang="id" class="hide-romaji">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalimat Jepang Sehari-hari / Everyday Japanese Sentences</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; background: #020617; color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 22px 16px 72px; }

  /* ---------------------------------------------------------------- screens */
  .screen[hidden] { display: none !important; }

  /* The two chooser screens are the whole page, so they are centred rather than stacked
     under a sticky bar that is not there yet. */
  .chooser { max-width: 560px; margin: 12vh auto 0; text-align: center; }
  .chooser h2 { font-size: 24px; font-weight: 700; color: #f8fafc; margin: 0 0 8px; }
  .chooser p  { font-size: 14px; color: #94a3b8; margin: 0 0 26px; }
  .choices { display: grid; gap: 12px; }
  .choice {
    display: block; width: 100%; box-sizing: border-box; cursor: pointer;
    background: #0b1220; color: #f8fafc; border: 1px solid #4a5a72; border-radius: 12px;
    padding: 18px 20px; font-size: 17px; font-family: inherit; text-align: left;
    transition: border-color .12s ease, transform .12s ease;
  }
  .choice:hover, .choice:focus-visible { border-color: #38bdf8; transform: translateY(-1px); }
  .choice .sub { display: block; font-size: 12.5px; color: #94a3b8; margin-top: 4px; }
  .choice .kana { float: right; color: #7ab8e8; font-size: 15px; }
  .choice[aria-disabled="true"] { opacity: .55; cursor: default; }
  .choice[aria-disabled="true"]:hover { transform: none; border-color: #4a5a72; }

  /* ---------------------------------------------------------------- search bar */
  .bar {
    position: sticky; top: 0; z-index: 500;
    background: rgba(2, 6, 23, .96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #334155;
    padding: 12px 0 10px;
    margin-bottom: 14px;
  }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  /* The field uses the expanded panel's surface and outline, so the two dark
     surfaces on the page match instead of inventing a third shade. */
  .searchrow input {
    flex: 1 1 auto; min-width: 0;
    background: #070c14; color: #f8fafc;
    border: 1px solid #4a5a72; border-radius: 10px;
    padding: 11px 13px; font-size: 15px; font-family: inherit;
  }
  .searchrow input::placeholder { color: #8b99ad; }
  .searchrow input:focus {
    outline: none; border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, .18);
  }
  .searchrow button {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    background: #070c14; color: #f8fafc; border: 1px solid #4a5a72;
    font-size: 18px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .searchrow button:hover { border-color: #38bdf8; }
  .hint {
    display: flex; justify-content: space-between; gap: 10px;
    color: #94a3b8; font-size: 12px; margin-top: 7px;
  }
  /* search scope + romaji toggle */
  .opts {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    margin-top: 9px;
  }
  .scopes { display: inline-flex; gap: 0; }
  .opts label {
    display: inline-flex; align-items: center; gap: 5px;
    color: #94a3b8; font-size: 12.5px; cursor: pointer;
    user-select: none;
  }
  .opts input { accent-color: #38bdf8; margin: 0; cursor: pointer; }
  /* the scope control reads as a segmented button group, so the active choice is
     obvious without relying on the small radio dot alone */
  .scopes label {
    border: 1px solid #4a5a72; background: #070c14;
    padding: 4px 11px; margin: 0;
  }
  .scopes label:first-child { border-radius: 8px 0 0 8px; }
  .scopes label:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .scopes label:has(input:checked) { border-color: #38bdf8; color: #f8fafc; }
  /* The romaji line is a sibling of the kanji line; hiding it must not leave a gap,
     so the whole line is removed from layout rather than made transparent. */
  .hide-romaji .romaji { display: none !important; }
  #sentinel { height: 1px; }
  .hint .examples { color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  h1 { font-size: 16px; font-weight: 600; color: #94a3b8; margin: 0 0 16px;
        letter-spacing: .02em; }

  /* ---------------------------------------------------------------- title list */
  .titles { display: grid; gap: 10px; }
  .titem {
    box-sizing: border-box; width: 100%; text-align: left; cursor: pointer;
    background: #0b1220; color: #f8fafc; border: 1px solid #334155;
    border-left: 5px solid #38bdf8; border-radius: 12px;
    padding: 14px 16px; font-family: inherit; font-size: 16px;
    transition: border-color .12s ease;
  }
  .titem:hover, .titem:focus-visible { border-color: #38bdf8; }
  .titem .meta {
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    margin-top: 7px; font-size: 12px; color: #94a3b8;
  }
  .titem .badge {
    display: inline-block; border: 1px solid #4a5a72; border-radius: 20px;
    padding: 0 9px; font-size: 11.5px; color: #cbd5e1;
  }
  .titem .badge.style { border-color: #38bdf8; color: #7ab8e8; }
  .titem .snippet {
    margin-top: 8px; font-size: 13.5px; color: #cbd5e1; line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /* A search hit offers the full narrative, which is the point of the title list:
     the reader looks for a word, then reads the piece it lives in. */
  .readfull {
    display: inline-block; margin-top: 10px; cursor: pointer;
    background: #070c14; color: #f8fafc; border: 1px solid #38bdf8; border-radius: 9px;
    padding: 7px 12px; font-size: 13px; font-family: inherit;
  }
  .readfull:hover { background: #0f172a; }

  /* ---------------------------------------------------------------- narrative */
  .backlink {
    display: inline-block; margin-bottom: 12px; cursor: pointer;
    background: none; border: 0; color: #7ab8e8; font-family: inherit;
    font-size: 13.5px; padding: 0; text-decoration: underline;
  }
  .narr-title { font-size: 22px; font-weight: 700; color: #f8fafc; margin: 0 0 6px; }
  .jp-sent {
    position: relative; background: #0b1220; border: 1px solid #334155;
    border-left: 5px solid #38bdf8; border-radius: 12px; margin: 16px 0;
    padding: 16px 18px; max-width: 100%; box-sizing: border-box; overflow: visible;
  }
  .jp-sent .qdet { display: block; }
  .jp-sent .qdet > summary {
    position: absolute; right: 10px; top: 10px;
    display: block; list-style: none; cursor: pointer; width: 34px; height: 34px;
    line-height: 30px; text-align: center; border-radius: 50%;
    background: #334155; color: #f8fafc; font-weight: 700; font-size: 17px;
    border: 2px solid #38bdf8; box-shadow: 0 2px 8px rgba(0,0,0,.5); user-select: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  .jp-sent .qdet > summary::-webkit-details-marker { display: none; }
  .jp-sent .qdet > summary::marker { content: ""; }
  .jp-sent .qdet:hover > summary { transform: scale(1.08); border-color: #f8fafc; }
  .jp-sent .qdet[open] > summary { border-color: #f59e0b; }

  .jp-sent .qpanel { width: 100%; overflow-wrap: anywhere; }
  .jp-sent .qpanel .gloss { table-layout: fixed; }
  .jp-sent .qpanel .gloss td { overflow-wrap: anywhere; }

  /* One line of the narrative. A conversation line carries a speaker label, and the label
     is what turns a wall of text into a dialogue. */
  .block { margin: 0 0 14px; }
  .block:last-child { margin-bottom: 0; }
  .block .speaker {
    display: inline-block; border-radius: 20px; padding: 0 10px; margin-bottom: 6px;
    font-size: 12px; font-weight: 700; color: #0b1220;
  }
  .kanji { font-size: 23px; line-height: 2.0; font-weight: 500; color: #f8fafc;
           white-space: normal; overflow-wrap: anywhere; padding-right: 6px; }
  .romaji { font-size: 15px; line-height: 1.85; font-style: italic; color: #94a3b8;
            margin-top: 3px; white-space: normal; overflow-wrap: anywhere; }

  @media (max-width: 520px) {
    .jp-sent .qpanel {
      border-radius: 10px !important;
      padding: 12px 12px !important;
      font-size: 13.5px !important;
    }
    /* Four nowrap columns need ~370px and do not fit in a phone-width card, so on
       small screens each word becomes a stacked block: kanji + romaji on one
       line, the gloss underneath. Nothing can push the card outwards. */
    .jp-sent .qpanel .gloss,
    .jp-sent .qpanel .gloss tbody,
    .jp-sent .qpanel .gloss tr,
    .jp-sent .qpanel .gloss td {
      display: block; width: auto !important;
    }
    .jp-sent .qpanel .gloss td { border-bottom: 0 !important; padding: 0 !important; }
    .jp-sent .qpanel .gloss tr {
      padding: 7px 0; border-bottom: 1px solid #334155;
    }
    .jp-sent .qpanel .gloss tr:last-child { border-bottom: 0; }
    .jp-sent .qpanel .gloss td.gk { display: inline-block; font-size: 15px !important; }
    .jp-sent .qpanel .gloss td.gr { display: inline-block; margin-left: 8px; }
  }

  .jp-sent .tk { border-radius: 3px; position: relative; }
  .jp-sent .tk:hover { background: rgba(56, 189, 248, .18); }

  /* The word bubble. It sits above the word it belongs to, pointed at it by a tail, and it
     never repeats the word: the reader is already looking at it, so the space goes to the
     answer. .tk is position:relative, which is what makes the word the containing block;
     without it the bubble is drawn against .jp-sent and lands in the middle of the card.

     Three rows, each with its own mark and colour, because when the reading and the gloss
     were joined by a slash a reader could not tell which was which. */
  .jp-sent .tk > .tip {
    position: absolute;
    bottom: 100%;
    margin-bottom: 6px;
    left: 0;
    z-index: 600;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding: 6px 9px;
    border-radius: 8px;
    background: #1e293b;
    border: 1px solid #475569;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .55);
    font-size: 13.5px;
    font-style: normal;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    /* The bubble is as wide as its content wants, and wraps only when the content would
     * otherwise leave the screen. `width:auto` on an absolutely positioned box is
     * shrink-to-fit bounded by the containing block, which is the WORD, so on a phone the
     * bubble became 64px wide and 621px tall: a column of text. max-width is the only thing
     * that may force a line break, so wrapping is a response to content, not to the screen. */
    width: max-content;
    max-width: calc(100vw - 24px);
    white-space: normal;
    pointer-events: none;
  }
  .jp-sent .tk:hover > .tip,
  .jp-sent .tk:focus-visible > .tip { display: flex; }
  .jp-sent .tk > .tip .tr { display: flex; align-items: baseline; white-space: normal; }
  /* Breaking inside a word is switched OFF here, explicitly: the kanji line sets
     `overflow-wrap: anywhere` so a long sentence cannot push the card sideways, and the
     bubble inherits it, which would allow a break inside a gloss. */
  .jp-sent .tk > .tip,
  .jp-sent .tk > .tip .tr,
  .jp-sent .tk > .tip .tx { overflow-wrap: normal; word-break: normal; }
  .jp-sent .tk > .tip .mk {
    flex: 0 0 auto; min-width: 3.6em; margin-right: 5px;
    font-size: 11px; letter-spacing: .02em; text-transform: uppercase; color: #64748b;
  }
  .jp-sent .tk > .tip .tx { flex: 0 1 auto; }
  .jp-sent .tk > .tip .t-kana .tx { font-style: italic; }
  .jp-sent .tk > .tip .t-id .tx { color: #f8fafc; }
  .jp-sent .tk > .tip .t-en .tx { color: #cbd5e1; }
  /* `below` flips the tail ONLY. The position is moved by script with a transform, never by
     switching top/bottom here: setting both edges on a box with height:auto makes the height
     stretch instead of fitting the content. */
  .jp-sent .tk > .tip.below::after {
    top: auto; bottom: 100%; margin-top: 0; margin-bottom: -5px;
    border-right: none; border-bottom: none;
    border-left: 1px solid #475569; border-top: 1px solid #475569;
  }
  .jp-sent .tk > .tip::after {
    content: "";
    position: absolute;
    top: 100%; left: 14px; margin-top: -5px;
    width: 9px; height: 9px;
    background: #1e293b;
    border-right: 1px solid #475569; border-bottom: 1px solid #475569;
    transform: rotate(45deg);
  }
  /* On a phone the bubble must still be readable in full: no clipping and no sideways
     scrolling, because a bubble the reader has to scroll is a bubble with something hidden. */
  @media (max-width: 520px) {
    .jp-sent .tk > .tip { max-width: calc(100vw - 24px); font-size: 13px; }
    .jp-sent .tk > .tip .tr { flex-direction: column; align-items: flex-start; }
    .jp-sent .tk > .tip .mk { min-width: 0; margin-right: 0; margin-bottom: 1px; }
  }

  mark { background: #f59e0b; color: #0b1220; border-radius: 3px; padding: 0 1px; }

  #empty {
    border: 1px dashed #334155; border-radius: 12px; padding: 26px 18px;
    text-align: center; color: #94a3b8; font-size: 14px;
  }

  @media (max-width: 420px) {
    .wrap { padding: 14px 10px 56px; }
    .jp-sent { padding: 14px 52px 14px 14px; }
    .hint .examples { display: none; }
    .chooser { margin-top: 7vh; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ---------------------------------------------------------- screen 1: language -->
  <section class="screen chooser" id="s-lang" hidden>
    <h2 data-str="chooseUi"></h2>
    <p data-str="chooseUiSub"></p>
    <div class="choices" id="lang-choices"></div>
  </section>

  <!-- ---------------------------------------------------- screen 2: target language -->
  <section class="screen chooser" id="s-target" hidden>
    <h2 data-str="chooseTgt"></h2>
    <p data-str="chooseTgtSub"></p>
    <div class="choices" id="target-choices"></div>
  </section>

  <!-- ------------------------------------------------ screen 3: search + title list -->
  <section class="screen" id="s-list" hidden>
    <header class="bar">
      <h1 id="page-title"></h1>
      <div class="searchrow">
        <input id="q" type="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" enterkeyhint="search">
        <button id="clear" type="button" hidden>&#215;</button>
      </div>
      <div class="opts">
        <div class="scopes" role="radiogroup">
          <label><input type="radio" name="scope" value="all" checked> <span data-str="scopeAll"></span></label>
          <label><input type="radio" name="scope" value="jp"> <span data-str="scopeJp"></span></label>
        </div>
        <label class="toggle"><input type="checkbox" id="rtoggle"> <span data-str="romaji"></span></label>
      </div>
      <div class="hint">
        <span id="count"></span>
        <span class="examples" id="examples"></span>
      </div>
    </header>
    <main id="list" class="titles"></main>
    <p id="empty" hidden></p>
    <div id="sentinel" aria-hidden="true"></div>
  </section>

  <!-- ------------------------------------------------------ screen 3b: one narrative -->
  <section class="screen" id="s-narrative" hidden>
    <button class="backlink" id="back" type="button"></button>
    <h2 class="narr-title" id="narr-title"></h2>
    <main id="narr"></main>
  </section>

</div>

<script src="const.js"></script>
<script src="data/curated.js"></script>
<script src="data/lexicon.js"></script>
<script src="data/bank.js"></script>
<!-- Written topics, one file each. Add a file here when a topic is written. -->
<script src="data/t_belanja.js"></script>
<script src="data/t_kerja.js"></script>
<script src="data/t_makan.js"></script>
<script src="data/t_rumah_tugas.js"></script>
<script src="data/t_telepon.js"></script>
<script src="data/t_rumah_santai.js"></script>
<script src="data/t_transportasi.js"></script>
<script src="data/t_santai.js"></script>
<script src="data/t_waktu_cuaca.js"></script>
<script src="data/t_jalan.js"></script>
<script src="data/t_klinik.js"></script>
<script src="data/t_kegiatan.js"></script>
<script src="data/t_sopan.js"></script>
<script src="app.js"></script>
</body>
</html>
