<!doctype html>
<!-- hide-romaji is on at load because the Romaji box starts unchecked; the
     existing change listener toggles this same class, so the two cannot disagree. -->
<html lang="id" class="hide-romaji">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalimat Jepang Sehari-hari / Everyday Japanese Sentences</title>
<style>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; background: #020617; color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 22px 16px 72px; }

  /* ---------------------------------------------------------------- search bar */
  .bar {
    position: sticky; top: 0; z-index: 500;
    background: rgba(2, 6, 23, .96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #334155;
    padding: 12px 0 10px;
    margin-bottom: 14px;
  }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  /* The field uses the expanded panel's surface and outline, so the two dark
     surfaces on the page match instead of inventing a third shade. */
  .searchrow input {
    flex: 1 1 auto; min-width: 0;
    background: #070c14; color: #f8fafc;
    border: 1px solid #4a5a72; border-radius: 10px;
    padding: 11px 13px; font-size: 15px; font-family: inherit;
  }
  .searchrow input::placeholder { color: #8b99ad; }
  .searchrow input:focus {
    outline: none; border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, .18);
  }
  .searchrow button {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    background: #070c14; color: #f8fafc; border: 1px solid #4a5a72;
    font-size: 18px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .searchrow button:hover { border-color: #38bdf8; }
  .hint {
    display: flex; justify-content: space-between; gap: 10px;
    color: #94a3b8; font-size: 12px; margin-top: 7px;
  }
  /* English gloss of the Indonesian heading, quieter than the heading itself */
  h1 .en { color: #8b99ad; font-weight: 500; }
  /* search scope + romaji toggle */
  .opts {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    margin-top: 9px;
  }
  .scopes { display: inline-flex; gap: 0; }
  .opts label {
    display: inline-flex; align-items: center; gap: 5px;
    color: #94a3b8; font-size: 12.5px; cursor: pointer;
    user-select: none;
  }
  .opts input { accent-color: #38bdf8; margin: 0; cursor: pointer; }
  /* the scope control reads as a segmented button group, so the active choice is
     obvious without relying on the small radio dot alone */
  .scopes label {
    border: 1px solid #4a5a72; background: #070c14;
    padding: 4px 11px; margin: 0;
  }
  .scopes label:first-child { border-radius: 8px 0 0 8px; }
  .scopes label:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .scopes label:has(input:checked) {
    border-color: #38bdf8; color: #f8fafc;
  }
  .scopes label.on { border-color: #38bdf8; color: #f8fafc; }
  /* The romaji line is a sibling of the kanji line; hiding it must not leave a gap,
     so the whole line is removed from layout rather than made transparent. */
  .hide-romaji .romaji { display: none !important; }
  #sentinel { height: 1px; }
  .hint .examples { color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint code {
    color: #e5e7eb; background: #070c14; border: 1px solid #334155;
    border-radius: 5px; padding: 1px 5px; font-size: 11.5px;
  }

  h1 { font-size: 16px; font-weight: 600; color: #94a3b8; margin: 0 0 16px;
        letter-spacing: .02em; }

  /* ---------------------------------------------------------------- behaviour */
  /* The ? summary is absolutely positioned at the card's top-right corner, and
     the ? expander is the last child, so while it is closed it contributes no
     height and the panel expands in place, under the sentence. */
  .jp-sent .qdet { display: block; }
  .jp-sent .qdet > summary {
    position: absolute; right: 10px; top: 10px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .jp-sent .qdet > summary::-webkit-details-marker { display: none; }
  .jp-sent .qdet > summary::marker { content: ""; }
  .jp-sent .qdet:hover > summary { transform: scale(1.08); border-color: #f8fafc; }
  .jp-sent .qdet[open] > summary { border-color: #f59e0b; }
  /* the card only needs to outrank the sticky bar for its own summary, which is
     inside it; nothing floats over the page any more */
  .jp-sent[hidden] { display: none !important; }

  /* the expanded panel is in-flow, so it can never cover the card's own bottom
     edge or a neighbouring block. On a phone it also gets a tighter radius and
     a little less padding, since it runs the full card width. */
  .jp-sent .qpanel { width: 100%; }
  /* stop the card from ever being widened by its own contents */
  .jp-sent { max-width: 100%; box-sizing: border-box; }
  .jp-sent .qpanel { overflow-wrap: anywhere; }
  .jp-sent .qpanel .gloss { table-layout: fixed; }
  .jp-sent .qpanel .gloss td { overflow-wrap: anywhere; }

  @media (max-width: 520px) {
    .jp-sent .qpanel {
      border-radius: 10px !important;
      padding: 12px 12px !important;
      font-size: 13.5px !important;
    }
    /* Four nowrap columns need ~370px and do not fit in a phone-width card, so on
       small screens each word becomes a stacked block: kanji + romaji on one
       line, the two glosses underneath. Nothing can push the card outwards. */
    .jp-sent .qpanel .gloss,
    .jp-sent .qpanel .gloss tbody,
    .jp-sent .qpanel .gloss tr,
    .jp-sent .qpanel .gloss td {
      display: block; width: auto !important;
    }
    .jp-sent .qpanel .gloss td {
      border-bottom: 0 !important; padding: 0 !important;
    }
    .jp-sent .qpanel .gloss tr {
      padding: 7px 0; border-bottom: 1px solid #334155;
    }
    .jp-sent .qpanel .gloss tr:last-child { border-bottom: 0; }
    .jp-sent .qpanel .gloss td.gk {
      display: inline-block; font-size: 15px !important;
    }
    .jp-sent .qpanel .gloss td.gr {
      display: inline-block; margin-left: 8px;
    }
  }

  .jp-sent .tk { border-radius: 3px; position: relative; }
  .jp-sent .tk:hover { background: rgba(56, 189, 248, .18); }

  /* The word bubble. It sits above the word it belongs to, pointed at it by a tail, and it
     never repeats the word: the reader is already looking at it, so the space goes to the
     answer. .tk is position:relative, which is what makes the word the containing block; without
     it the bubble is drawn against .jp-sent and lands in the middle of the card, which happened
     once and every content check passed anyway.

     Three rows, each with its own mark and colour, because when the reading and the two glosses
     were joined by a slash a reader could not tell which was which. The colours are the ones the
     gloss table already uses for the same three things, so the bubble and the panel agree:
     romaji grey like gr, Indonesian bright like the reading, English dim like ge. */
  .jp-sent .tk > .tip {
    position: absolute;
    bottom: 100%;
    margin-bottom: 6px;
    left: 0;
    z-index: 600;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding: 6px 9px;
    border-radius: 8px;
    background: #1e293b;
    border: 1px solid #475569;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .55);
    font-size: 13.5px;
    font-style: normal;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    white-space: nowrap;
    pointer-events: none;
  }
  .jp-sent .tk:hover > .tip,
  .jp-sent .tk:focus-visible > .tip { display: flex; }
  /* Each row is a flex line so the mark and the text are separate boxes. That is what keeps a
     label whole: when both were inline text inside one box, a narrow screen wrapped mid-label and
     the reader saw "ROMAJ" with the I on the next line. A mark is never allowed to break. */
  .jp-sent .tk > .tip .tr { display: flex; align-items: baseline; white-space: nowrap; }
  .jp-sent .tk > .tip .mk {
    flex: 0 0 auto;
    min-width: 3.6em;
    margin-right: 5px;
    font-size: 11px;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: #64748b;
  }
  .jp-sent .tk > .tip .tx { flex: 0 1 auto; }
  /* The reading takes the colour of the word it belongs to, set inline. The two glosses keep the
     colours the panel already uses for the same two things, so the bubble and the panel agree. */
  .jp-sent .tk > .tip .t-kana .tx { font-style: italic; }
  .jp-sent .tk > .tip .t-id .tx { color: #f8fafc; }
  .jp-sent .tk > .tip .t-en .tx { color: #cbd5e1; }
  /* `below` flips the tail ONLY. The position is moved by script with a transform, never by
     switching top/bottom here: setting both edges on a box with height:auto makes the height
     stretch instead of fitting the content, which showed up as a bubble 734px tall in CI. */
  .jp-sent .tk > .tip.below::after {
    top: auto; bottom: 100%; margin-top: 0; margin-bottom: -5px;
    border-right: none; border-bottom: none;
    border-left: 1px solid #475569; border-top: 1px solid #475569;
  }
  /* the tail: a rotated square tucked under the bubble, pointing at the word */
  .jp-sent .tk > .tip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 14px;
    margin-top: -5px;
    width: 9px; height: 9px;
    background: #1e293b;
    border-right: 1px solid #475569;
    border-bottom: 1px solid #475569;
    transform: rotate(45deg);
  }
  /* On a phone the bubble must still be readable in full: no clipping and no sideways
     scrolling, because a bubble the reader has to scroll is a bubble with something hidden.
     So it wraps inside the viewport width, the rows lose their nowrap, and the position is
     clamped by script at this width as well. */
  @media (max-width: 520px) {
    .jp-sent .tk > .tip {
      max-width: calc(100vw - 24px);
      font-size: 13px;
    }
    /* The label column narrows instead of breaking, and only the text may wrap. wrap:anywhere is
       deliberately absent: it is what split the labels in the first place. */
    .jp-sent .tk > .tip .mk { min-width: 3.1em; font-size: 10px; }
    .jp-sent .tk > .tip .tr { white-space: normal; }
    .jp-sent .tk > .tip .tx { overflow-wrap: break-word; word-break: break-word; }
  }

  mark { background: #f59e0b; color: #0b1220; border-radius: 3px; padding: 0 1px; }

  #empty {
    border: 1px dashed #334155; border-radius: 12px; padding: 26px 18px;
    text-align: center; color: #94a3b8; font-size: 14px;
  }

  @media (max-width: 420px) {
    .wrap { padding: 14px 10px 56px; }
    .jp-sent { padding: 14px 52px 14px 14px !important; }
    .hint .examples { display: none; }
  }
</style>
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <h1>Kalimat Jepang Sehari-hari <span class="en">Everyday Japanese Sentences</span></h1>
    <div class="searchrow">
      <input id="q" type="search" autocomplete="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="search"
             aria-label="Search sentences: kanji, romaji, Indonesian, or English"
             placeholder="Search: Kanji / Romaji / Indonesia / English">
      <button id="clear" type="button" title="Hapus pencarian / Clear search"
              aria-label="Hapus pencarian / Clear search" hidden>&#215;</button>
    </div>
    <div class="opts">
      <div class="scopes" role="radiogroup" aria-label="Cakupan pencarian / Search scope">
        <label><input type="radio" name="scope" value="all" checked> <span>All</span></label>
        <label><input type="radio" name="scope" value="jp"> <span>Japanese</span></label>
      </div>
      <label class="toggle"><input type="checkbox" id="rtoggle"> <span>Romaji</span></label>
    </div>
    <div class="hint">
      <span id="count"></span>
      <span class="examples">coba / try: <code>ohayou</code> <code>おはよう</code> <code>murah cheap</code> <code>berapa</code></span>
    </div>
  </header>

  <main id="list"></main>
  <p id="empty" class="empty" hidden>Tidak ada kalimat yang cocok. / No sentences match.</p>
  <div id="sentinel" aria-hidden="true"></div>
</div>

<script src="const.js"></script>
<script src="data/curated.js"></script>
<script src="data/lexicon.js"></script>
<script src="data/bank.js"></script>

</body>
</html>
