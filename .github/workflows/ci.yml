# Syntax guard for this repository.
#
# This repo has no tests, on purpose: the sentences are written by reading them, and every rule
# that used to be checked by a script now lives in docs/SPEC.md as something the writer keeps.
# So what is left for CI is the one class of mistake a script can still catch and a reader
# cannot see: a JavaScript file that does not parse. A page whose data file has a stray comma is
# a blank page, and that failure is worth catching before it is published.
#
#   node --check <file>   parses the file without running it
#
# What this deliberately does NOT check: whether a narrative is good, whether a title is unique,
# whether a kind repeats. Those are the writer's job now, recorded in docs/JUDUL.md.
#
# No browser step and no test runner: both existed to check rendered sentences, and the checking
# is gone.

name: syntax

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Every JavaScript file in the repo: the shell's own scripts and every data file. The list
      # is built by the shell rather than written out, so a data file added later is covered
      # without anyone remembering to add it here.
      - name: Parse every JavaScript file
        run: |
          set -e
          files=$(ls *.js data/*.js)
          echo "checking: $files"
          for f in $files; do node --check "$f"; done
          echo "all files parse"
